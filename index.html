<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP PDV - Sistema de Gestão</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-emerald-100 text-emerald-800 min-h-screen flex flex-col select-none font-sans">

    <!-- Barra de Menu Superior (Estilo Windows App) -->
    <header class="bg-emerald-700 text-emerald-200 text-xs border-b border-emerald-300 flex items-center justify-between px-2 h-8 select-none">
    <div class="flex items-center gap-1.5 px-2 py-1 font-bold text-emerald-400 bg-emerald-950/50 rounded mr-2">
                <i data-lucide="monitor-dot" class="w-3.5 h-3.5"></i>
                <span>LP-PDV v1.0</span>
            </div>

        <div class="flex items-center gap-3 px-2 text-emerald-400">
            <span class="flex items-center gap-1"><i data-lucide="user" class="w-3 h-3 text-emerald-400"></i> Operador: Caixa 01</span>
            <span>|</span>
            <span id="live-clock">00:00:00</span>
        </div>
    </header>

    <!-- Barra de Ferramentas / Atalhos Rápidos (Toolbar Clássica) -->
    <nav class="bg-white border-b border-emerald-300 px-3 py-1.5 flex items-center gap-2 shadow-sm">
      
       <button id="menu-products" class="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-emerald-50 text-emerald-900 border border-emerald-200 rounded text-xs font-medium transition shadow-xs cursor-pointer">
    <i data-lucide="package" class="w-4 h-4"></i>
    <span>Produtos</span>
</button>
        <button id="menu-cash" class="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-emerald-50 text-emerald-900 border border-emerald-200 rounded text-xs font-medium transition shadow-xs cursor-pointer">
    <i data-lucide="vault" class="w-4 h-4 text-emerald-700"></i> Caixa
</button>

        <button id="menu-reports" class="flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-emerald-50 text-emerald-900 border border-emerald-200 rounded text-xs font-medium transition shadow-xs cursor-pointer">
    <i data-lucide="file-text" class="w-4 h-4 text-emerald-700"></i> Relatórios
</button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 rounded text-xs font-medium transition shadow-sm">
            <i data-lucide="file-text" class="w-4 h-4 text-emerald-500"></i> Notas Fiscais
        </button>
        <div class="h-5 w-px bg-emerald-300 mx-1"></div>
        <button class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-300 rounded text-xs font-medium transition shadow-sm">
            <i data-lucide="lock" class="w-4 h-4 text-rose-600"></i> Fechar Caixa
        </button>

        <button onclick="window.openSuprimento()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer">
    <i data-lucide="arrow-down-circle" class="w-3.5 h-3.5"></i> Suprimento
</button>
<button onclick="window.openSangria()" class="bg-amber-700 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer">
    <i data-lucide="arrow-up-circle" class="w-3.5 h-3.5"></i> Sangria
</button>
    </nav>

    <!-- Main Content (Layout de PDV Tradicional em 2 colunas) -->
    <main class="flex-1 p-3 grid grid-cols-1 lg:grid-cols-3 gap-3 max-w-[1920px] mx-auto w-full overflow-hidden">
        
        <!-- Coluna Esquerda: Vitrine / Pesquisa de Produtos (2/3) -->
        <section class="lg:col-span-2 bg-white border border-emerald-300 rounded-lg p-3 flex flex-col gap-3 shadow-sm">
            <div class="flex items-center justify-between gap-3 bg-emerald-50 p-2.5 rounded border border-emerald-200">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-emerald-400"></i>
                    <input type="text" id="search-product" placeholder="Digite o nome ou código do produto para buscar..." class="w-full bg-white border border-emerald-300 rounded px-3 py-1.5 pl-9 text-sm text-emerald-800 focus:outline-none focus:border-emerald-600 shadow-inner">
                </div>
            </div>
            
            <!-- Grid de Produtos com visual limpo (branco gelo/verde claro) -->
            <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2.5 overflow-y-auto max-h-[calc(100vh-230px)] p-1">
                <!-- Preenchido via JS -->
            </div>
        </section>

        <!-- Coluna Direita: Carrinho / Cupom Atual (1/3) -->
        <section class="bg-white border border-emerald-300 rounded-lg p-3 flex flex-col justify-between shadow-sm">
            <div class="flex flex-col gap-3 flex-1 overflow-hidden">
                <div class="flex items-center justify-between border-b border-emerald-200 pb-2 bg-emerald-50 px-2 rounded">
                    <h2 class="font-bold text-sm text-emerald-700 flex items-center gap-2">
                        <i data-lucide="shopping-cart" class="text-emerald-600 w-4 h-4"></i>
                        <span>Itens do Cupom Fiscal</span>
                    </h2>
                    <button id="clear-cart" class="text-xs text-rose-600 hover:text-rose-800 font-medium transition">Limpar (F4)</button>
                </div>

                <!-- Lista de Itens -->
                <div id="cart-items" class="flex-1 overflow-y-auto space-y-1.5 pr-1 border border-emerald-200 rounded p-2 bg-emerald-50/50">
                    <p class="text-emerald-400 text-xs text-center py-12">Nenhum item lançado</p>
                </div>
            </div>

            <!-- Totais e Rodapé do Caixa -->
            <div class="border-t border-emerald-200 pt-3 mt-3 flex flex-col gap-2.5 bg-emerald-50 p-3 rounded border">
                <div class="flex justify-between items-center text-xs text-emerald-600">
                    <span>Subtotal</span>
                    <span id="subtotal-value" class="font-semibold text-emerald-800">R$ 0,00</span>
                </div>
                <div class="flex justify-between items-center text-xl font-black text-emerald-900 border-t border-emerald-200 pt-2">
                    <span class="text-sm font-bold text-emerald-700">TOTAL A PAGAR</span>
                    <span id="total-value" class="text-emerald-700">R$ 0,00</span>
                </div>
                <button id="btn-checkout" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-2.5 rounded transition flex items-center justify-center gap-2 shadow text-sm cursor-pointer">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>FINALIZAR VENDA (F10)</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Script Principal -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
